name: Watch SIRI appointment slots

on:
  schedule:
    # Odd minute on purpose: GitHub's scheduler is a best-effort queue and is
    # heavily delayed at the top of the hour, where everyone's cron piles up.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      run_minutes:
        description: 'How long to watch, in minutes (max ~350; job hard-caps at 360)'
        required: false
        default: '55'

permissions:
  contents: write

concurrency:
  group: siri-slot-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_MINUTES: ${{ github.event.inputs.run_minutes || '55' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Restore state
        continue-on-error: true
        run: |
          git fetch --depth=1 origin watcher-state \
            && git checkout FETCH_HEAD -- 'state-*.json' \
            || echo "no prior state, starting fresh"

      - name: Watch for new slots
        run: uv run --frozen python watcher.py --max-runtime "$RUN_MINUTES"

      - name: Persist state
        if: always()
        run: |
          shopt -s nullglob
          files=(state-*.json)
          [ "${#files[@]}" -gt 0 ] || { echo "no state to persist"; exit 0; }
          # Commit to a dedicated branch so main stays clean and the branch keeps a
          # single commit. Pushes through origin, reusing the credential
          # actions/checkout configured, and -f because state-*.json is gitignored.
          # git reset clears the index so only the state files land in the commit.
          git checkout --orphan watcher-state
          git reset --quiet
          git add -f -- "${files[@]}"
          git -c commit.gpgsign=false commit -q \
            -m "Update watcher state $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin HEAD:refs/heads/watcher-state
          echo "pushed ${files[*]}"