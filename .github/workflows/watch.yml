name: Watch SIRI appointment slots

on:
  schedule:
    # Odd minute on purpose: GitHub's scheduler is a best-effort queue and is
    # heavily delayed at the top of the hour, where everyone's cron piles up.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      run_minutes:
        description: 'How long to watch, in minutes (max ~350; job hard-caps at 360)'
        required: false
        default: '55'
      poll_interval:
        description: 'Seconds between polls'
        required: false
        default: '60'

permissions:
  contents: write

concurrency:
  group: siri-slot-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_MINUTES: ${{ github.event.inputs.run_minutes || '55' }}
      POLL_INTERVAL: ${{ github.event.inputs.poll_interval || '60' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Restore state
        continue-on-error: true
        run: |
          if git fetch --depth=1 origin watcher-state; then
            found=0
            while read -r f; do
              [ -n "$f" ] || continue
              git show "FETCH_HEAD:$f" > "$f" && { echo "restored $f"; found=1; }
            done <<EOF
          $(git show FETCH_HEAD --name-only --pretty=format: | grep '^state' || true)
          EOF
            [ "$found" = 1 ] || echo "state branch had no state files"
          else
            echo "no prior state, starting fresh"
          fi

      - name: Watch for new slots
        run: uv run python watcher.py --max-runtime "$RUN_MINUTES"

      - name: Persist state
        if: always()
        env:
          STATE_BRANCH: watcher-state
        run: |
          set -eo pipefail
          shopt -s nullglob
          files=(state-*.json)
          [ -f state.json ] && files+=(state.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no state to persist"
            exit 0
          fi
          tmp="$(mktemp -d)"
          cp "${files[@]}" "$tmp/"
          cd "$tmp"
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git -c commit.gpgsign=false commit -q -m "watcher state $(date -u +%FT%TZ)"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${STATE_BRANCH}"
          echo "state pushed to ${STATE_BRANCH}: ${files[*]}"
